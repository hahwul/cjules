# Ameba configuration for cjules.
# https://github.com/crystal-ameba/ameba
#
# Only rules that conflict with deliberate, documented project conventions are
# disabled here; everything else runs with ameba defaults and is expected to
# stay clean.

# Locals and instance vars intentionally mirror the Jules REST API JSON field
# names verbatim (createTime, gitPatch, planGenerated, nextPageToken, ...) so the
# code maps 1:1 onto the upstream API. snake_case would obscure that mapping.
Naming/VariableNames:
  Enabled: false

# Short block parameter names (s, a, l, j, ...) are used idiomatically throughout
# the command and serialization layers.
Naming/BlockParameterName:
  Enabled: false

# The CLI dispatcher and per-command OptionParser flag handlers are inherently
# branch-heavy; high cyclomatic complexity is expected for argument parsing here
# and does not indicate a refactor is needed.
Metrics/CyclomaticComplexity:
  Enabled: false

# not_nil! is used deliberately: flag values are captured inside OptionParser
# blocks (closures), so Crystal's flow typing cannot narrow them and not_nil! is
# the idiomatic guard; specs also use it over decoded JSON fixtures whose shape is
# guaranteed by the fixture.
Lint/NotNil:
  Enabled: false

# `read_secret` traps INT only to restore terminal echo during password entry,
# and resets it in the same method's ensure block. `Process.on_terminate` also
# installs HUP and TERM handlers, and its counterpart `Process.restore_interrupts!`
# is just `Signal::INT.reset` -- so migrating would leave stale HUP/TERM handlers
# that `exit 130` for the rest of the process, with no API to remove them.
# The INT trap/reset pair is the correct scope here.
Lint/SignalTrap:
  Enabled: false

# The bash/zsh/fish completion scripts are verbatim shell payloads. The quoted
# heredoc markers (<<-'B') keep them out of Crystal's interpolation and escape
# processing, so a future script gaining a `\` or a `#{` cannot silently change
# meaning. That the current text happens not to need escaping is not the point.
Style/HeredocEscape:
  Enabled: false

# Spec JSON fixtures use %(...) so the embedded double quotes need no escaping,
# which keeps them readable as the API payloads they mirror. A heredoc would
# trade that for indentation bookkeeping.
Style/MultilineStringLiteral:
  Enabled: false
